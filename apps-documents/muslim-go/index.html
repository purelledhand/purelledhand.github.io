<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Documents - Muslim Go</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            line-height: 1.6;
            color: #5D4E37;
            background: linear-gradient(135deg, #F5E6D3 0%, #E8D4B8 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            color: #5D4E37;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;
            color: #8B7355;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: #F5E6D3;
            border-radius: 12px;
            text-decoration: none;
            color: #5D4E37;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .link-button:hover {
            background: #6B9071;
            color: #FFFFFF;
            border-color: #6B9071;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(107, 144, 113, 0.3);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .link-icon {
            font-size: 24px;
        }

        .link-text {
            text-align: left;
        }

        .link-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .link-description {
            font-size: 14px;
            opacity: 0.8;
        }

        .arrow {
            font-size: 20px;
            opacity: 0.6;
        }

        .footer {
            padding-top: 24px;
            border-top: 2px solid #F5E6D3;
        }

        .app-info {
            font-size: 14px;
            color: #8B7355;
            margin-bottom: 8px;
        }

        .compliance {
            font-size: 16px;
            font-weight: 700;
            color: #6B9071;
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px;
            }

            h1 {
                font-size: 24px;
            }

            .link-title {
                font-size: 16px;
            }

            .link-description {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🕌</div>
        <h1>Muslim Go</h1>
        <p class="subtitle">Legal Documents</p>

        <div class="links">
            <a href="privacy-policy.html" class="link-button">
                <div class="link-content">
                    <span class="link-icon">🛡️</span>
                    <div class="link-text">
                        <div class="link-title">Privacy Policy</div>
                        <div class="link-description">How we protect your data</div>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="terms-of-service.html" class="link-button">
                <div class="link-content">
                    <span class="link-icon">📄</span>
                    <div class="link-text">
                        <div class="link-title">Terms of Service</div>
                        <div class="link-description">Our terms and conditions</div>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>

        <div class="footer">
            <p class="app-info">Muslim Go - Your companion for Quranic learning</p>
            <p class="compliance">✓ Shariah-Compliant</p>
        </div>
    </div>
</body>
</html>
